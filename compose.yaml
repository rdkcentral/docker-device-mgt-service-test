services:

  mock-xconf:
    image: "ghcr.io/rdkcentral/docker-device-mgt-service-test/mockxconf:latest"
    container_name: "mockxconf"
    ports:
      - "50050:50050"
      - "50051:50051"
      - "50052:50052"
      - "50053:50053"
      - "50054:50054"
      - "50055:50055"  # RDK-61060: XPKI Certifier
      - "50056:50056"
      - "50057:50057"
      - "50058:50058"
      - "50059:50059"  # Crash metadata endpoint
      - "50060:50060"  # S3 presigned URL endpoint
      - "50061:50061"  # CRL mTLS server
      - "127.0.0.1:50062:50062"  # CRL control endpoint (localhost-only)
      # 50063 (OCSP responder) and 50064 (OCSP stapling server) are internal-only:
      # 50063 is queried from 127.0.0.1 inside the container, and 50064 is reached
      # container-to-container over the Docker network, so neither is published to
      # the host. They remain EXPOSEd in the Dockerfile for documentation.
    volumes:
      - ../:/mnt/L2_CONTAINER_SHARED_VOLUME
    environment:
      - ENABLE_MTLS=true
      - ENABLE_CRL_L3=true


  l2-container:
    image: "ghcr.io/rdkcentral/docker-device-mgt-service-test/native-platform:latest"
    container_name: "native-platform"
    ports:   
      - "9090:9090"  
    depends_on:
      - mock-xconf
    volumes:
      - ../:/mnt/L2_CONTAINER_SHARED_VOLUME
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined 
    environment:
      - ENABLE_MTLS=true    
      - ENABLE_CRL_L3=true
  
  nmap-container:
    image: "ghcr.io/rdkcentral/docker-device-mgt-service-test/native-platform:latest"
    container_name: "nmap-platform"  
    depends_on:
      - mock-xconf
    volumes:
      - ../:/mnt/L2_CONTAINER_SHARED_VOLUME
    cap_add:
      - NET_ADMIN      
      
