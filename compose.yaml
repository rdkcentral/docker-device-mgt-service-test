services:

  mock-xconf:
    image: "ghcr.io/rdkcentral/docker-device-mgt-service-test/mockxconf:latest"
    container_name: "mockxconf"
    ports:
      - "50050:50050"
      - "50051:50051"
      - "50052:50052"
      - "50053:50053"
      - "50054:50054"
      - "50055:50055"  # RDK-61060: XPKI Certifier
      - "50056:50056"
      - "50057:50057"
      - "50058:50058"
      - "50059:50059"  # Crash metadata endpoint
      - "50060:50060"  # S3 presigned URL endpoint
      - "50061:50061"  # RDK-61158: CRL mTLS server
      - "50062:50062"  # RDK-61158: CRL control endpoint
      - "50063:50063"  # RDK-61158: OCSP responder
      - "50064:50064"  # RDK-61158: OCSP stapling server
    volumes:
      - ../:/mnt/L2_CONTAINER_SHARED_VOLUME
    environment:
      - ENABLE_MTLS=true
      - ENABLE_CRL_L3=true


  l2-container:
    image: "ghcr.io/rdkcentral/docker-device-mgt-service-test/native-platform:latest"
    container_name: "native-platform"
    ports:   
      - "9090:9090"  
    depends_on:
      - mock-xconf
    volumes:
      - ../:/mnt/L2_CONTAINER_SHARED_VOLUME
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined 
    environment:
      - ENABLE_MTLS=true    
      - ENABLE_CRL_L3=true
  
  nmap-container:
    image: "ghcr.io/rdkcentral/docker-device-mgt-service-test/native-platform:latest"
    container_name: "nmap-platform"  
    depends_on:
      - mock-xconf
    volumes:
      - ../:/mnt/L2_CONTAINER_SHARED_VOLUME
    cap_add:
      - NET_ADMIN      
      
